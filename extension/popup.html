<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paste Download App</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://pastedownloadapp.com" target="_blank" rel="noopener">
      <img src="icons/logo.svg" alt="" width="28" height="28" />
      <span>Paste Download</span>
    </a>
    <button type="button" id="themeToggle" class="icon-btn" aria-label="Theme: system. Click to change">
      <svg data-icon="light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg data-icon="dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg data-icon="system" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
  </header>

  <main>
    <section class="card">
      <div class="card-head">
        <div>
          <h1>Paste an image.</h1>
          <p>Copy any image, then download it in one step.</p>
        </div>
      </div>

      <div class="format-row">
        <span class="label" id="formatLabel">Save as</span>
        <div class="segmented" role="radiogroup" aria-labelledby="formatLabel" id="formatGroup">
          <button type="button" role="radio" aria-checked="true" data-format="png">PNG</button>
          <button type="button" role="radio" aria-checked="false" data-format="jpeg">JPEG</button>
          <button type="button" role="radio" aria-checked="false" data-format="webp">WebP</button>
        </div>
      </div>

      <div id="dropZone" tabindex="0" role="button" aria-label="Paste or tap to download the copied image">
        <div id="placeholder">
          <div class="tile" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <p class="title">Press <kbd id="shortcut">Ctrl + V</kbd> to download</p>
          <p class="hint">or tap anywhere here</p>
          <span class="pill primary" id="pasteBtn">Paste from clipboard</span>
        </div>

        <div id="preview" hidden>
          <div class="thumb">
            <img id="previewImg" alt="Pasted image preview" />
          </div>
          <p id="info" class="info"></p>
          <div class="actions">
            <button type="button" id="downloadBtn" class="pill primary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download again
            </button>
            <button type="button" id="clearBtn" class="pill secondary">Clear</button>
          </div>
        </div>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <span class="privacy">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Processed on your device
    </span>
    <a href="https://pastedownloadapp.com" target="_blank" rel="noopener">Open web app</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
